name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check whether PROFILE_GH_TOKEN is configured
        env:
          HAS_PAT: ${{ secrets.PROFILE_GH_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "PROFILE_GH_TOKEN is set — using it for the contribution query."
          else
            echo "::warning::PROFILE_GH_TOKEN is NOT set — falling back to the default GITHUB_TOKEN, which only sees public activity."
          fi

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # The default GITHUB_TOKEN can only see public activity, which
          # undercounts contributions to private repos. PROFILE_GH_TOKEN
          # (a PAT with access to those repos) makes the snake match the
          # real contribution graph shown on the GitHub profile.
          GITHUB_TOKEN: ${{ secrets.PROFILE_GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
