name: Sync Featured Projects from GitHub

on:
  schedule:
    # Run once a day
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate featured projects section
        env:
          # A PAT with `repo` scope (stored as the PROFILE_GH_TOKEN secret) lets
          # this see private pinned repos too. Falls back to the default token,
          # which only sees public data.
          GH_TOKEN: ${{ secrets.PROFILE_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/sync-featured-projects.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync featured projects from GitHub"
          git push
